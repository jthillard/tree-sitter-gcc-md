[package]
name = "tree-sitter-gcc-md"
description = "GCC Machine Description grammar for tree-sitter"
version = "0.1.0"
authors = ["Pietro Monteiro <pietro@sociotechnical.xyz>"]
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "gcc-md"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://codeberg.org/arsen/gcc-md-mode"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.9"
